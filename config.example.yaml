# The one file a host project writes to adopt the mechanism. Copy it to `config/agents.yaml` at
# the host's root and fill it in: every value below belongs to ONE project, and nothing under
# `agent_os/` reads a project literal from anywhere else
# (agent_os/docs/adr/2026-09-14-the-agent-mechanism-is-project-agnostic-and-configured-not-coded.md,
# agent_os/docs/adr/2026-09-21-the-mechanism-is-one-directory-extended-by-hosts-and-never-modified.md).
#
# `AGENTS_CONFIG_PATH` overrides the location; otherwise the mechanism reads `config/agents.yaml`
# under the HOST's root (`$AGENT_OS_HOST_ROOT`, else the git checkout the cwd belongs to), never
# under `agent_os/`. The commentary in the host's own copy is where the reasons for ITS values
# belong; the reasons for the SHAPE of a key belong here.
#
# The project below is invented. Nothing in it names a real repository, identity or topic. It is
# also what the mechanism's OWN test suite (`agent_os/tests -q`) loads instead of a host's real
# config (`agent_os/tests/conftest.py`, #512) -- so every key below is filled with a value some
# test needs, not left at its bare minimum, and a shape a helper patches (a block list, a single
# line) is kept in the same shape a host's own file uses.

project:
  # owner/name on GitHub. Read after the `AGENT_OS_GH_REPO` environment variable and before
  # `gh repo view` on the cwd.
  repo: example-org/example-project
  # The management epic whose `agents_paused` label is the full stop for every role.
  tracking_epic: 1
  # The GitHub Project (v2) number the board columns live on.
  board_number: 1
  # Where `<slug>.json` + `<slug>.pem` live, one pair per GitHub App identity. Relative to the
  # host's root.
  secrets_dir: .secrets/gh_apps
  # The planner's own App slug, distinct from any worker's.
  planner_app: example-planner
  # The base name of the systemd --user units `agent_os.install` writes and `agent_os.doctor`
  # checks: `<this>.service`, `<this>.timer`, `<this>.service.d/override.conf`. Empty refuses
  # both commands rather than inventing a name from the repository's own.
  guard_unit: example-guard
  # Where this project's module docs live, one per `project.modules` entry -- the `__MODULE_DOCS__`
  # token in the rendered `.claude/agents/*.md` prompts points here.
  module_docs_dir: docs/modules
  # The one human. Substituted into every `@<login>` a role writes.
  human_login: example-login
  # Language for anything addressed to the human. Code, identifiers, commits and repository
  # documentation stay English regardless of this.
  human_language: English
  # Gitignored file holding the ntfy topic string, relative to the host's root.
  notify_topic_file: .secrets/ntfy_topic
  # One one-line template per page the mechanism can send, written in `human_language`. A key the
  # mechanism asks for and this mapping does not carry is an error when the config loads, not when
  # the page is due; so is a template `str.format` cannot parse. The placeholders each one may use
  # are fixed by the call site -- these six are the whole set today.
  messages:
    review_ready: "Review pending: issue #{issue} «{title}» is approved and only needs merging - {url}"
    quota_exhausted_no_fallback: "No quota left and issue #{issue} declares no fallback (class «{task_class}», backend {backend}): it cannot move without you"
    planner_run_cap_reached: "The planner has spent its daily run cap ({runs}/{cap}) and will dispatch nothing more today; {pending} event(s) wait for tomorrow: {context}"
    backend_worktree_missing: "Backend with no worktree: {backend} has no worktree at {worktree} and {issue_count} ready issue(s) cannot move until you create it"
    unreviewed_pull_request: "Lost review: PR #{pr} for issue #{issue} has no review and no {role} running - it may have died leaving no trace"
    backend_worktree_dirty: "Blocked backend: {backend}'s worktree {worktree} has uncommitted work no run will clear ({paths}); {issue_count} ready issue(s) wait, and no run on it can start or resume until you commit or clean it"
  # The project's own compact test wrapper, injected into the worker's RULES as `__TEST_COMMAND__`.
  # A host with more than one test suite names the wrapper that runs the right one.
  test_command: scripts/test.sh
  # Whether `agent-os-install` writes `.github/workflows/ci-host.yml`, running `test_command` on
  # every pull request with no path filter. The control plane never merges a PR whose head SHA
  # reports zero checks, and `ci-agent-os.yml` only fires on `agent_os/**`, so a host without a
  # workflow of its own could never get a host-only PR merged. Set it to false only when the
  # host's own CI already reports a check on every pull request; `agent-os-doctor` checks either way.
  install_host_ci: true
  # How the control plane merges a PR it verified: `merge` (a merge commit), `squash` or `rebase`
  # -- the `merge_method` of GitHub's REST merge endpoint, rendered into the installed
  # `.claude/agents/control-plane.md`. The mechanism needs none in particular (merge condition 4
  # compares content, not ancestry). Any other value fails the load. Default `merge`.
  merge_method: merge
  # The `model:` of each agent definition `agent_os.install` writes into `.claude/agents/`
  # (agent-os#96). A definition has ONE model, which is why task writing is its own agent
  # (`task-writer`) and not a duty of the control plane. A value is whatever `claude --model`
  # accepts -- an alias or a full id -- and is opaque to the mechanism. The one-shot roles
  # (planner, validator, refiner) are not here: their model is `classes.<name>.model` below.
  # Every key is optional; these are the defaults: ONE backend (Claude Code), Sonnet for every role
  # (docs/tree/dec-one-backend-claude-code-with-opus-at-the-top.md). `custodian` and `consolidator`
  # are the two roles that run on Opus, rarely, and only the key and its default exist so far: the
  # roles themselves arrive in Stage 2 of docs/AGENTOS_V2_PLAN.md and nothing reads these yet.
  agent_models:
    control_plane: sonnet
    worker_runner: sonnet
    task_writer: sonnet
    custodian: opus
    consolidator: opus
  # How a fresh worktree -- a worker's on `init`, a validator's throwaway one -- is made runnable,
  # since it carries tracked files only. Each `worktree_links` path (relative to the repository
  # root) is symlinked from this checkout when it exists here; then `worktree_setup_command`, when
  # set, runs by `bash -c` inside the worktree before any backend starts, and a non-zero exit
  # refuses the run. Defaults: the root `.venv` and `.env`, and no setup command. A monorepo whose
  # environment lives in subdirectories lists those, or provisions them itself:
  #   worktree_links: [.env]
  #   worktree_setup_command: "cd backend && uv sync --frozen && cd ../web && npm ci"
  worktree_links: [.venv, .env]
  worktree_setup_command: ""
  # The linters the validator runs on the files a pull request touches, each a command the file
  # list is appended to, from inside its worktree. Empty (the default) renders no lint bullet.
  lint_commands:
    - .venv/bin/ruff check
    - .venv/bin/ruff format --check
  # One file of YOUR OWN per role, appended verbatim at that role's `__PROJECT_EXTRAS__` point in
  # `agent_os/prompts/<role>.md`: the place for a sentence only this project can write -- how its
  # package resolves under test, which budget class a worker task belongs in. Paths relative to
  # this repository's root, every key optional, and a role named here whose file is missing stops
  # the render rather than silently losing the paragraph. Empty by default: a project that names
  # none reads the mechanism's own templates and nothing else.
  prompt_extras: {}
  # Exported into every worker's backend process. The KEYS also render the worker's environment
  # paragraph -- names, never values -- so no prompt ever spells a credential. Empty renders no
  # such paragraph at all.
  worker_environment:
    DATABASE_URL: postgresql://app_ro:app_ro@localhost:5432/app
  # The HOST project's protected paths: globs relative to the host's root, where a `*` crosses `/`
  # (fnmatch semantics). These hold REGARDLESS of what a brief says, and a brief naming one is a
  # defect in the brief. ONE list behind both halves of the rule: the audit regex a run's changed
  # paths are matched against, and the "FILES YOU MUST NOT TOUCH" paragraph the worker reads.
  forbidden_paths:
    - docs/adr/*
    - docker-compose.yml
  # Subtracted from `forbidden_paths` to give the subset the MERGE gate audits (condition 3). It
  # names the EXEMPTION, not the audited set, so a path added above is audited unless it is also
  # listed here. For delivery directories: a diff that only ADDS a file under one of them changes
  # nothing the protection exists for.
  merge_audit_exempt_paths:
    - docs/adr/*
  # Commands no role may run, each with the one-line reason its prohibition rests on. Rendered
  # into the worker's, the validator's and the refiner's RULES from this one list. Empty renders
  # no such paragraph anywhere.
  never_run:
    - command: "--force-push"
      reason: rewrites shared history other clones have already built work on top of
    - command: drop-database
      reason: destroys the shared database with no dry-run flag and no way back
  # The absolute path of every external executable the mechanism's units call by bare name, by
  # command name: the backend CLIs (`claude`, or another a host adds) and the tracker CLI (`gh`) alike, for when
  # the launcher's PATH is not the shell's (a systemd user unit does not carry nvm). A name with no
  # entry resolves to itself, which is the bare-name PATH lookup the drivers did before.
  # `agent-os-install` turns every value into a directory on the generated unit's
  # `Environment=PATH=` (`executables_path_prefix()`), which is why a command that is not a
  # backend, like `gh`, belongs here too -- e.g. `gh: /home/linuxbrew/.linuxbrew/bin/gh`.
  executables: {}
  # Every backend a worker or a role can run on, by name. Nothing in the mechanism compares a
  # backend's name against a literal: what it can do is read off its entry, so a third CLI is one
  # entry here (plus one parser under agent_os/streams/ only if its events are a new shape). The
  # defaults describe ONE backend, Claude Code; a host that wants a second one (Qwen Code, with
  # `stream: qwen_jsonl` and `quota: none`) adds its entry, its worker classes and its fallbacks
  # itself -- the machinery below (`fallback:`, `escalate:`, `slots:`) is unchanged by that choice.
  #   command:  what the drivers run -- an absolute path or a bare name. Omitted, the
  #             `executables` entry of the same name, else the backend's own name. An absolute
  #             command is added to `executables`, the PATH set the generated units carry.
  #   worktree: its worktree, relative to the host's root. Nothing in the mechanism creates these.
  #   app:      the GitHub App a worker on it signs as, so its commits and comments are
  #             attributable to it and never to the human's account.
  #   stream:   the registered parser its jsonl events are read with (claude_jsonl, qwen_jsonl);
  #             it also picks the command line the drivers launch it with. Unknown fails at load.
  #   quota:    the detector whose `exhausted` verdict cuts a live run (claude_rate_limit), or
  #             `none` -- the verdict is recorded and nothing is cut on it.
  #   slots:    how many workers may run on it at once, each in a worktree and on a branch of its
  #             own (default 1). Slot 1 is `worktree` and `.cache/worker_<name>.*`, exactly as a
  #             backend without this key; slot N is `<worktree>-N` and `.cache/worker_<name>-N.*`
  #             (`worker_task.sh <name> init` creates every missing one). The quota verdict and
  #             the App stay the backend's, shared by its slots: an exhausted window cuts every
  #             live slot. `planner.max_parallel_issues` still caps workers across every slot of
  #             every backend, and two of them never share a `module:` label.
  # DEPRECATED, for one release: `worktrees:` + `worker_apps:` (+ `executables:` for the command)
  # in place of this section still load, with one warning, and are ignored when this is present.
  backends:
    claude:
      worktree: ../example-claude
      app: example-claude
      stream: claude_jsonl
      quota: claude_rate_limit
  # One App per non-worker role. A role missing here signs as `planner_app`.
  role_apps: {}
  # The host's own module names, one per module doc. They become the `module:<name>` half of the
  # fixed label set the tracker CLI creates. An empty list creates no `module:` label.
  modules:
    - core
  # The mechanical state vocabulary. Exactly one of the first six is ever set on an issue; the
  # last three are not states. A host that spells its labels differently changes them here.
  labels:
    refine: status:refine
    ready: status:ready
    doing: status:doing
    blocked_on_human: status:blocked-on-human
    ai_completed: status:ai-completed
    review: status:review
    # Human-only: the full stop, on the tracking epic.
    agents_paused: status:agents-paused
    # Human-only: on a feature, its refined children may be promoted to `ready` mechanically.
    auto_ready: auto-ready
    # A one-shot request, not a state: the next tick removes it and wakes the planner.
    wake_planner: wake:planner
  # Where each state shows up on the board. The labels are the state; this is the mirror the human
  # reads. `blocked-on-human` is null on purpose: being blocked says nothing about how far the work
  # got, so the item keeps the column it is already in. These six names are the Project (v2) board
  # columns §4.3 has every host create, not this project's own choice.
  board_columns:
    refine: Backlog
    ready: Ready for AI
    doing: In progress
    blocked-on-human: null
    ai-completed: AI completed
    review: Review
    done: Done

# The mechanism's own files -- NOT the host's to configure. Copy this section unchanged: it names
# the drivers, the library and the role prompts, so it travels with the mechanism. A worker's diff
# may touch one of these ONLY when the issue body names that path as the target of the work, which
# is what lets the mechanism develop itself without failing its own ownership audit.
mechanism:
  own_paths:
    - agent_os/*
    - .claude/*
  # How long the guard's persisted verdict on a backend's quota stays believable, in minutes. Past
  # it the verdict reads as UNKNOWN and a role launches on its own backend.
  quota_verdict_ttl_minutes: 60

# How often the planner may be woken, and by what.
planner:
  # Rate limit on the `idle_dispatchable`/`refine_pending` events. `pr_merged` and `nudged` are
  # edges and bypass it.
  idle_wake_minutes: 120
  # Hard cap on planner runs per day, across every event kind.
  max_runs_per_day: 12
  # `WIP: cut by guard` commits since a branch's fork point at or above which a relaunch is
  # refused: a run that has been cut this many times is not making progress.
  relaunch_cap: 3
  # How many issues may have a worker alive at once, across every slot of every backend. Enforced
  # by the worker driver, not by the planner.
  max_parallel_issues: 1
  # How far back the tick looks for a closed issue still carrying a state label.
  reconcile_closed_lookback_days: 30
  # Whether the tick may ever write `refine_pending`, i.e. whether the planner may launch the
  # refiner unattended. False until a human has reviewed one of its dry runs.
  refiner_unattended: false

# The puntal (Agentos v2): the live stand-in for one UI action that has no hand-written
# implementation yet, a one-shot headless process per click (`bin/puntal_task.sh`, ADR
# 2026-10-04-a-puntal-is-a-one-shot-headless-process-under-its-own-class-and-cannot-write-code).
# It plans in one model turn with no tool and the app's code executes the plan (docs/AGENT_OS.md
# §4.7). Every key is optional and these are the defaults, but the driver refuses to run a puntal
# that has no `persistence_command` (state is real from day one: a puntal that cannot persist
# contradicts itself between sessions) and, on its default path, one that has no `executor_command`.
puntal:
  # The app's persistence API: the command (shell-split) the puntal's ONE tool runs, from the
  # host's root, with the arguments the puntal gives it -- `./state get tickets T-1` runs
  # `<persistence_command> get tickets T-1`. The puntal reads and writes state through it and
  # through nothing else. `puntal_task.sh --persistence-command` and the environment variable
  # `PUNTAL_PERSISTENCE_COMMAND` outrank this key. Example:
  #   persistence_command: .venv/bin/python scripts/app_state.py
  persistence_command: ""
  # A text file (relative to the host's root) describing that command's subcommands, rendered into
  # the puntal's contract so it spends no turn asking `--help`. Empty renders nothing there.
  persistence_api_file: ""
  # The app's EXECUTOR: the command (shell-split, run from the host's root) that applies a puntal's
  # validated operations atomically through the app's own API. It reads `{"operations": [...]}` on
  # stdin and prints `{"ok": true, "bindings": {...}}` or `{"ok": false, "errors": [...]}`, exit 0
  # either way (`agent_os/product/puntal/fast/executor.py`). Empty: the driver refuses a click it
  # could not finish, unless the caller asks for the plan alone (`--json --plan-only`).
  # `PUNTAL_EXECUTOR_COMMAND` and `--executor-command` outrank it. Example:
  #   executor_command: .venv/bin/python scripts/app_executor.py
  executor_command: ""
  # The first words a node's declared read (`reads:` in its frontmatter) may start with: the
  # persistence API's subcommands that change nothing. Any other is skipped, so a node file can
  # never make the pre-helper write.
  read_subcommands: [get, list]
  # The executor is code on the click's critical path: cut after this many seconds.
  executor_timeout_seconds: 30
  # Kills the run's process group after this many seconds. A hung-process SAFETY for a person
  # waiting on a click, never a budget: spend is bounded by `classes.puntal` below.
  timeout_seconds: 90
  # The most tool calls one invocation's SLOW path may make before the driver cuts it (a loop
  # guard; a run with no commits has no commit cadence to catch one). The fast path has no tool.
  max_tool_calls: 12
  # `claude --effort` (low, medium, high, xhigh, max). Empty leaves the CLI's own default.
  effort: ""

# The feedback interpreter (Agentos v2): the agent behind a test session's comment box, a chat in
# which the owner's messages are interpreted into items (`bin/interpreter_task.sh`, docs/FEEDBACK_INTERPRETER.md).
# One model turn with no tool per message; its model and per-invocation ceilings are `classes.interpreter`.
# Every key is optional and these are the defaults.
interpreter:
  # The language of its `reply`. Empty: the language the owner's latest message is written in. A
  # name such as `Spanish` fixes it whatever the owner writes.
  reply_language: ""
  # Kills the run's process group after this many seconds (a safety for an owner waiting in a chat).
  timeout_seconds: 60
  # `claude --effort`. Empty leaves the CLI's own default.
  effort: ""
  # The most recent thread messages the brief carries; the new message and the items always go whole.
  max_thread_messages: 40

# The product tree and the decision ledger (`agent-os-tree`, docs/AGENT_OS.md §4.6). Every key is
# optional; the values below are the defaults except `ticket_budget_class`, which has none.
tree:
  # The directory holding the tree AND the ledger: one directory of Markdown files with YAML
  # frontmatter, nodes and decisions together, in any subdirectories the host likes. Relative to
  # the host's root; `agent-os-tree --root DIR` overrides it for one run. A worker writes node files
  # back (the mechanism it resolved, the implementation pointer), so this directory must not be in
  # `project.forbidden_paths`.
  root: product
  # The worker class a compiled ticket names in its `<!-- budget: <class> -->` line. Must be a
  # worker class below -- the config fails to load otherwise. Empty (the default) makes
  # `agent-os-tree compile` refuse until `--budget-class` says which: the mechanism does not know
  # a host's class names and does not guess one.
  ticket_budget_class: mechanical-sonnet
  # Labels every compiled ticket carries besides its task type label (`project.labels.types`): a
  # marker for the tickets that came from the tree, the module they belong to. The initial
  # `status:*` label is not decided here -- `compile` only renders; creating the issues and the
  # state they start in is the wiring of Phase 2.
  ticket_labels: []
  # True makes this a v2 host, one whose work comes from the tree (agent-os#117). The guard then
  # leaves out of the dispatchable set a ready issue with no `<!-- node: <id> -->` line or with an
  # open `<!-- depends-on: -->` ticket, `worker_task.sh start` refuses one that shares code
  # (`<!-- touches: -->` paths) with a running ticket, and a worker's brief carries the slice of its
  # node. False (the default) leaves dispatch as it was; a hand-written issue is not dispatchable
  # in a v2 host, so turn it on once the backlog is compiled tickets.
  dispatch_by_node: false
  # Files besides goal nodes that are the owner's what -- the evaluators of the method (its battery,
  # the thresholds of its indicators, the rule that tells what from how), as fnmatch globs on
  # repository paths. A pull request touching one of them, or a goal node, is never merged
  # automatically (`agent-os-sessions guard-what`, docs/AGENT_OS.md §4.10). Default: none.
  owner_only_paths: []

# The progress board (`agent-os-tree board sync|order`, docs/AGENT_OS.md §4.6): a GitHub Project
# generated from the tree, one item per functional requirement, as a view -- the files stay the
# record. Every key is optional; the values below are the defaults. The token behind `gh` needs the
# `project` scope (`gh auth refresh -s project`).
board:
  # The `--owner` of every `gh project` call: a user or organization login; `@me` is the
  # authenticated user.
  owner: "@me"
  # The Project's number. 0 finds it by `title` among the owner's Projects and creates it on a real
  # sync when none has that title; a number pins it.
  number: 0
  title: Agentos progress board
  # A text field on each item: the count of its parts by state. Sync creates and rewrites it.
  progress_field: Progress
  # A number field the owner fills by hand (lower first). Sync creates it and never writes it;
  # `agent-os-tree board order` reads it back as the owner's order of the backlog.
  order_field: Order

# The code-quality ratchet (`agent-os-quality`, docs/AGENT_OS.md §4.8). Every key is optional; the
# values below are the defaults. New files and folders must be within the limits and touched ones
# may never get worse than on the pull request's base branch.
quality:
  max_entries_per_folder: 12
  max_lines_per_file: 300
  # Paths that are prose or recorded data, not code: not measured and not entered (a directory
  # ends in `/`). Listing this key REPLACES the default list. Also never measured, whatever is
  # listed: `tree.root`, and the mechanism's own directory when it is vendored under the host.
  excluded_paths:
    - docs/
    - tests/golden/
    - config.example.yaml
    - uv.lock

# The budget classes. `max_context` applies per stage process, fresh at every stage;
# `max_cost_usd` and `max_total_tokens` apply to the whole issue. Every issue body names one in a
# `<!-- budget: <class> -->` line; a class with a `role:` field belongs to that role instead.
# These numbers are a starting point, not a calibration: measure real runs and tune them.
#
# Two worker classes (a mechanical one and a less specified, more expensive one) and one class per
# one-shot role, all on Claude Code with Sonnet (docs/tree/dec-one-backend-claude-code-with-opus-at-the-top.md).
# A worker class may declare two optional things, none of them here by default:
#
#   fallback: {backend, model, ceilings}   -- like a role's: when the class's own backend reads
#       exhausted (the guard's fresh persisted verdict) the worker driver REFUSES to launch it and
#       names the fallback, and the planner redispatches on that backend's own worktree. A worker
#       cannot change backend in place (worktree, branch, state and event stream are per backend).
#       Declaring it silences the guard's `quota_exhausted_no_fallback` page for the class. It
#       needs a second backend in `project.backends`.
#   escalate: {model, after: [commit_cut, stage_failed]}   -- the stronger model, on the SAME
#       backend, for the process `resume` launches after a stage that was cut (`commit_cut`) or
#       ended without its commit (`stage_failed`); logged in the launch's `model:` line. A fresh
#       `start` and the stages a run chains after a green one run `model` again.
#
# A class's `model` is an opaque string the mechanism hands to the backend's CLI: it keeps no
# allowlist and no price table, and the cost of a run is whatever the CLI reports in its result
# event (`total_cost_usd`). Moving a class to another model is editing this one line.
#
# A worker class that retries a cut stage on Opus is the same class with one more key:
#
#   complex-sonnet:
#     ...
#     escalate:
#       model: claude-opus-5-5
#       after: [commit_cut, stage_failed]
classes:
  mechanical-sonnet:
    description: small, fully specified change in one module with no design decision left to make
    backend: claude
    model: claude-sonnet-5-5
    max_context: 400000
    max_cost_usd: 5.0
    max_total_tokens: 80000000
    commit_warn_turns: 25
    commit_cut_turns: 90

  complex-sonnet:
    description: any other task or bug -- cross-module work, or one that needs judgement
    backend: claude
    model: claude-sonnet-5-5
    max_context: 800000
    max_cost_usd: 20.0
    max_total_tokens: 150000000
    commit_warn_turns: 25
    commit_cut_turns: 90

  planner:
    role: planner
    backend: claude
    model: claude-sonnet-5-5
    max_context: 40000
    max_cost_usd: 2.0
    max_total_tokens: 2000000
    commit_warn_turns: 30
    commit_cut_turns: 50

  validator:
    role: validator
    backend: claude
    model: claude-sonnet-5-5
    max_context: 200000
    max_cost_usd: 5.0
    max_total_tokens: 10000000
    commit_warn_turns: 30
    commit_cut_turns: 50

  refiner:
    role: refiner
    backend: claude
    model: claude-sonnet-5-5
    max_context: 200000
    max_cost_usd: 5.0
    max_total_tokens: 10000000
    commit_warn_turns: 30
    commit_cut_turns: 50

  # The expert's class (Agentos v2, Stage 1): populates the product tree -- requirements, use
  # cases, experiments, questions with their scope and default answer, challenges -- and opens a
  # pull request on the host's tree. Its ceilings bind one run on one issue. No `fallback:`: it
  # runs on the one backend a v2 host has, and a run the quota refuses is relaunched, not
  # substituted. `agent_os/bin/agent_task.sh expert <issue>` launches it; its logs and `runs.tsv`
  # are `.cache/expert/`. Its App is `project.role_apps.expert`, else the planner's.
  expert:
    role: expert
    backend: claude
    model: claude-sonnet-5-5
    max_context: 200000
    max_cost_usd: 5.0
    max_total_tokens: 10000000
    commit_warn_turns: 30
    commit_cut_turns: 50
    qwen_fallback_eligible: false

  # The puntal's class: small context and a low ceiling PER INVOCATION -- `max_context`,
  # `max_cost_usd` and `max_total_tokens` all bind one click, not an issue, and are checked on the
  # run's own stream: `max_cost_usd` is also handed to the CLI (`--max-budget-usd`), and the driver
  # cuts a run whose context or token total passes its ceiling. Placeholders until the latency
  # spike measures a real floor. No `fallback:` (refused at load: the puntal never changes
  # backend), and `commit_*_turns` are required by the schema and read by nothing for this role,
  # as for the planner. Its logs and `runs.tsv` are `.cache/puntal/`.
  puntal:
    role: puntal
    backend: claude
    model: claude-sonnet-5-5
    max_context: 30000
    max_cost_usd: 0.25
    max_total_tokens: 300000
    commit_warn_turns: 6
    commit_cut_turns: 12

  # The feedback interpreter's class: one chat message per invocation, so a small context and a low
  # ceiling, like the puntal's. No `fallback:` (refused at load). Its logs and `runs.tsv` are
  # `.cache/interpreter/`.
  interpreter:
    role: interpreter
    backend: claude
    model: claude-sonnet-5-5
    max_context: 30000
    max_cost_usd: 0.25
    max_total_tokens: 300000
    commit_warn_turns: 6
    commit_cut_turns: 12
