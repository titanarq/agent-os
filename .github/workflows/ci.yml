# The mechanism's own CI, for its own repository (split from a host's
# `agent_os/` by `git subtree split`, #515). GitHub reads workflows only at a repository's root, so
# inside a host this file is inert: it runs only once `agent_os/` IS the root. Same run as the
# host's out-of-tree step: bootstrap the mechanism's own interpreter from scratch, lint it, and run
# its suite with no database, no network and no real backend.
name: CI

on:
  pull_request:
  push:
    # A push only runs the tests when the four-hour clock is due, so the last merge of a session is
    # checked within the interval (docs/tree/dec-a-full-run-every-four-hours-of-development.md).
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  tests:
    # Where the job runs is a repository variable, not a literal here: this file sits under the
    # host-literal walk (tests/test_no_host_literals.py) like every other one. `CI_RUNS_ON` holds a
    # JSON label list (e.g. the owner's self-hosted runners); unset, it is GitHub's hosted runner.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    # GitHub's runners set FORCE_COLOR and Rich then splits flag-shaped tokens in CLI error text
    # into ANSI-wrapped spans; TERM=dumb renders as a local run does.
    env:
      TERM: dumb
    steps:
      - uses: actions/checkout@v7
        with:
          # The code-quality ratchet needs the merge-base with the pull request's base branch.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: bootstrap the mechanism's own interpreter
        run: bash bootstrap.sh

      - name: ruff
        run: .venv/bin/ruff check . && .venv/bin/ruff format --check .

      # New files and folders comply with the limits, touched ones never get worse than on the base
      # branch (docs/AGENT_OS.md, "The code-quality ratchet"). A push to main has no base to compare.
      - name: code-quality ratchet
        if: github.event_name == 'pull_request'
        run: .venv/bin/python -m agent_os.quality --base origin/${{ github.base_ref }}

      # Every commit of the pull request that touches the product tree carries `Node-Change`; only
      # the pull request's own range is judged, so commits already on main are not re-judged.
      - name: the Node-Change trailer on every commit that touches the product tree
        if: github.event_name == 'pull_request'
        run: .venv/bin/python -m agent_os.product.tree trailers --base origin/${{ github.base_ref }} --root docs/tree

      # A manifest that maps a test file to no group, or a path that does not exist, fails here.
      - name: the test manifest is coherent
        run: .venv/bin/agent-os-tests check --manifest tests/selection

      # The clock: when the last successful full run was (`never` or `unknown` make one due).
      - name: read the full-run clock
        id: clock
        run: echo "last=$(.venv/bin/agent-os-tests last-full-run --repo ${{ github.repository }})" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      # The tests the branch's manifest maps to what it touched, or the whole suite when the clock
      # is due or nothing maps the change. On a push it runs only when the clock is due.
      - name: the mechanism's suite
        id: tests
        run: >-
          .venv/bin/agent-os-tests run
          --base origin/${{ github.base_ref || github.ref_name }}
          --manifest tests/selection
          --command ".venv/bin/pytest -q -n 6 --junitxml=suite.xml"
          --last-full-run "${{ steps.clock.outputs.last }}"
          ${{ github.event_name == 'push' && '--only-when-due' || '' }}

      # The index of the run (counts and one line per failing test), which `agent-os-integrate
      # result` downloads to tell which member of a red group to evict. Published green or red.
      - name: the suite summary index
        if: always() && steps.tests.conclusion != 'skipped'
        run: python3 -I bin/dev/suite_index.py suite.xml "${{ steps.tests.outcome == 'success' && 0 || 1 }}" > suite.summary.json

      - name: upload the suite summary index
        if: always() && steps.tests.conclusion != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: agent-os-suite-summary
          path: suite.summary.json
          if-no-files-found: ignore
          retention-days: 3

      # A failed run uploads nothing, so the clock keeps its old origin and the next run is full.
      - name: record the full run
        if: success() && steps.tests.outputs.mode == 'full'
        run: >-
          printf '{"sha":"%s","date":"%s","event":"%s"}\n' "$GITHUB_SHA" "$(date -u +%FT%TZ)"
          "$GITHUB_EVENT_NAME" > full-run.json

      - name: upload the full-run marker
        if: success() && steps.tests.outputs.mode == 'full'
        uses: actions/upload-artifact@v7
        with:
          name: agent-os-full-run
          path: full-run.json
          retention-days: 1
