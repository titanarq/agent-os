# The host's own CI, rendered by `agent-os-install` from `agent_os/templates/ci-host.yml` with
# `project.test_command` when the host has no `.github/workflows/ci-host.yml` yet.
#
# It runs on EVERY pull request, with no path filter, because the control plane's merge
# condition 1 counts zero checks on a PR's head SHA as not met
# (agent_os/docs/adr/2026-09-24-a-pr-with-no-checks-fails-the-ci-condition-and-every-host-ships-a-ci.md):
# `ci-agent-os.yml` only fires on `agent_os/**`, so without this file a host-only PR reports no
# check and can never be merged in the human's name.
#
# A starting point, not the host's whole CI: add whatever setup the test command needs (a
# toolchain, a service container, dependencies) before its step. A host that already has CI
# reporting on every pull request sets `project.install_host_ci: false` instead of taking this.
name: host-tests

on:
  pull_request:
  push:
    # The default branch: edit it if yours differs. A push only runs the tests when the four-hour
    # clock is due, so the last merge of a session is checked within the interval.
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The code-quality ratchet needs the merge-base with the pull request's base branch.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: bootstrap the mechanism's own interpreter
        run: bash agent_os/bootstrap.sh

      # New files and folders comply with the limits in `quality:` of `config/agents.yaml`, and a
      # touched one never gets worse than on the base branch. The mechanism's own directory is
      # skipped: it only ever changes through a `git subtree pull`.
      - name: code-quality ratchet
        if: github.event_name == 'pull_request'
        run: agent_os/.venv/bin/python -m agent_os.quality --base origin/${{ github.base_ref }}

      # A manifest that maps a test file to no group, or a path that does not exist, fails here.
      - name: the test manifest is coherent
        run: agent_os/.venv/bin/agent-os-tests check

      # The clock: when the last successful full run was (`never` or `unknown` make one due).
      - name: read the full-run clock
        id: clock
        run: echo "last=$(agent_os/.venv/bin/agent-os-tests last-full-run --repo ${{ github.repository }})" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      # The host's test command: the selected tests, or the whole suite when the clock is due or
      # nothing maps the change. On a push it runs only when the clock is due.
      - name: the host's test command
        id: tests
        run: >-
          agent_os/.venv/bin/agent-os-tests run
          --base origin/${{ github.base_ref || github.ref_name }}
          --command "__TEST_COMMAND__"
          --last-full-run "${{ steps.clock.outputs.last }}"
          ${{ github.event_name == 'push' && '--only-when-due' || '' }}

      # A failed run uploads nothing, so the clock keeps its old origin and the next run is full.
      - name: record the full run
        if: success() && steps.tests.outputs.mode == 'full'
        run: >-
          printf '{"sha":"%s","date":"%s","event":"%s"}\n' "$GITHUB_SHA" "$(date -u +%FT%TZ)"
          "$GITHUB_EVENT_NAME" > full-run.json

      - name: upload the full-run marker
        if: success() && steps.tests.outputs.mode == 'full'
        uses: actions/upload-artifact@v7
        with:
          name: agent-os-full-run
          path: full-run.json
          retention-days: 1

      # (A pull request only: a push has no base branch.) Every commit that touches the product tree says why: `Node-Change: usage | rework | owner`
      # (agent_os/docs/AGENT_OS.md §4.6). Reads git only, on the history the checkout above fetched.
      - name: the Node-Change trailer on every commit that touches the product tree
        if: github.event_name == 'pull_request'
        run: agent_os/.venv/bin/python -m agent_os.product.tree trailers --base origin/${{ github.base_ref }}
